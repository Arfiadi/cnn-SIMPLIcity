experiment_name: "efficientnet_b0_v3_final"

environment:
  device: "auto"
  precision: "amp_fp16"
  seed: 42
  deterministic_cudnn: true

data:
  dataset_name: "SIMPLIcity"
  data_dir: null
  img_size: [224, 224]                   # Canonical ImageNet resolution for full-canvas sharpness
  preserve_aspect_ratio: false           # Eliminate 33.3% dead padding bars diluting Global Average Pooling
  num_classes: 10
  batch_size: 32
  num_workers: 4
  pin_memory: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5
    rotation_degrees: 15
    color_jitter: [0.15, 0.15, 0.15]
    random_erasing_prob: 0.10
    crop_scale: [0.85, 1.0]

model:
  name: "efficientnet_b0"
  num_classes: 10
  activation: "silu"
  dropout_rate: 0.25
  use_batch_norm: true
  pretrained: true                       # ImageNet-1K pretrained weights
  freeze_backbone: false
  head_type: "linear"                    # Streamlined single-layer head (12.8k param, no bottleneck)

training:
  epochs: 20
  optimizer: "adamw"
  lr: 0.00025
  min_lr: 0.000001
  weight_decay: 0.0001
  momentum: 0.9
  scheduler: "cosine"
  loss_name: "cross_entropy"
  label_smoothing: 0.04                  # Allows cross-entropy loss to drop smoothly below 0.38
  gradient_clipping: 1.0
  warmup_head_epochs: 0                  # End-to-end fine-tuning from epoch 1 (no backbone starvation)

control:
  early_stopping_enabled: true
  monitor: "val_macro_f1"
  mode: "max"
  patience: 8
  min_delta: 0.001
  output_dir: "outputs/efficientnet_b0_v3_final"

evaluation:
  batch_size: 32
  metrics: ["accuracy", "macro_precision", "macro_recall", "macro_f1"]
  generate_confusion_matrix: true
  error_analysis_top_k: 10
  use_tta: false                         # Single-pass deterministic evaluation (no post-processing tricks)
