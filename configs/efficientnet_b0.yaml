experiment_name: "efficientnet_b0_enhanced_240"

environment:
  device: "auto"
  precision: "amp_fp16"
  seed: 42
  deterministic_cudnn: true

data:
  dataset_name: "SIMPLIcity"
  data_dir: null
  img_size: [240, 240]                   # Native compound-scaled resolution for EfficientNet-B0
  preserve_aspect_ratio: true            # Letterbox padding preserving 100% of building/mountain geometry
  num_classes: 10
  batch_size: 32
  num_workers: 4
  pin_memory: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5
    rotation_degrees: 15
    color_jitter: [0.15, 0.15, 0.15]
    random_erasing_prob: 0.10
    crop_scale: [0.75, 1.0]

model:
  name: "efficientnet_b0"
  num_classes: 10
  activation: "silu"
  dropout_rate: 0.3
  use_batch_norm: true
  pretrained: true                       # ImageNet-1K pretrained weights
  freeze_backbone: false
  head_type: "enhanced"                  # Two-stage projected head with BatchNorm1d + SiLU

training:
  epochs: 25
  optimizer: "adamw"
  lr: 0.0003
  min_lr: 0.000001
  weight_decay: 0.0001
  momentum: 0.9
  scheduler: "cosine"
  loss_name: "cross_entropy"
  label_smoothing: 0.08                  # Prevent overconfident background memorization
  gradient_clipping: 1.0
  warmup_head_epochs: 5                  # Two-stage progressive fine-tuning (5 ep head warm-up)

control:
  early_stopping_enabled: true
  monitor: "val_macro_f1"
  mode: "max"
  patience: 8
  min_delta: 0.001
  output_dir: "outputs/efficientnet_b0_enhanced_240"

evaluation:
  batch_size: 32
  metrics: ["accuracy", "macro_precision", "macro_recall", "macro_f1"]
  generate_confusion_matrix: true
  error_analysis_top_k: 10
  use_tta: false                         # Single-pass deterministic evaluation (no post-processing tricks)
