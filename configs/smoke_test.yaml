data:
  data_dir: null
  img_size: [128, 128]
  batch_size: 4
  num_workers: 0

model:
  name: "baseline_custom"
  num_classes: 10
  activation: "relu"

training:
  epochs: 2
  lr: 0.001
  weight_decay: 0.0
  optimizer: "adam"
  scheduler: "none"
  patience: 2
  grad_clip: 1.0
  seed: 42
  device: "cpu"

output:
  dir: "outputs/smoke_test"
